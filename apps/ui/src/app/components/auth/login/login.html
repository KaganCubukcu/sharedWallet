<div
  class="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-indigo-500/10 via-transparent to-transparent"
>
  <div
    class="max-w-md w-full space-y-8 bg-slate-900/50 backdrop-blur-xl p-10 rounded-[40px] border border-slate-800 shadow-2xl"
  >
    <!-- Logo & Title -->
    <div class="text-center">
      <div class="inline-flex bg-indigo-500/10 p-4 rounded-3xl mb-4 border border-indigo-500/20">
        <span class="text-3xl">🔑</span>
      </div>
      <h2 class="text-3xl font-black text-white tracking-tight">Welcome Back</h2>
      <p class="text-slate-500 text-sm mt-2 font-medium">Please enter your details to sign in</p>
    </div>

    <!-- Error Alert -->
    <div
      *ngIf="errorMessage"
      class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-4 rounded-2xl text-sm font-medium animate-in fade-in zoom-in duration-300"
    >
      ⚠️ {{ errorMessage }}
    </div>

    <form (submit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Email</label>
        <input
          type="text"
          [(ngModel)]="loginData.email"
          name="email"
          placeholder="johndoe@example.com"
          required
          class="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-white placeholder:text-slate-800"
        />
      </div>

      <!-- Password -->
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1"
          >Password</label
        >
        <input
          type="password"
          [(ngModel)]="loginData.password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-white placeholder:text-slate-800"
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-indigo-500 text-white font-black py-4 rounded-2xl hover:bg-indigo-400 transition-all active:scale-[0.98] shadow-xl shadow-indigo-500/20 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <!-- Footer -->
    <div class="text-center pt-4">
      <p class="text-slate-500 text-sm font-medium">
        Don't have an account?
        <a
          routerLink="/register"
          class="text-indigo-400 hover:text-indigo-300 font-bold ml-1 transition-colors"
          >Join Now</a
        >
      </p>
    </div>
  </div>
</div>
